services:
    fastapi-app:
      build: .
      container_name: fastapi-app
      ports:
        - "5000:5000"
      restart: unless-stopped
    prometheus:
      image: prom/prometheus:latest
      container_name: prometheus
      ports:
        - "9090:9090"
      depends_on:
        - fastapi-app
    grafana:
      image: grafana/grafana:latest
      container_name: grafana
      ports:
        - "3000:3000"
      depends_on:
        - prometheus

volumes:
  promtheus_data: 
  grafana_data: 
